[package]
name = "opentalk-service-auth"
description = "Authorize internal services using API-Tokens"
version = "0.2.0"
authors = ["OpenTalk Team <mail@opentalk.eu>"]
publish = true
edition = "2024"
homepage = "https://opentalk.eu/"
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-service-auth"
license = "EUPL-1.2"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
axum = [
  "dep:axum",
  "dep:tower",
  "dep:futures",
  "opentalk-types-api-common/axum",
]
actix = ["dep:actix-web", "dep:futures", "opentalk-types-api-common/actix"]

[dependencies]
axum = { version = "0.8", optional = true }
actix-web = { version = "4.12", optional = true }
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
opentalk-types-api-common = { version = "0.6", optional = true, features = [
  "http",
] }
thiserror = "2"
tower = { version = "0.5", optional = true }
futures = { version = "0.3", optional = true }
rand = "0.9"


[dev-dependencies]
toml = "1.0"
config = "0.15"

[lints.clippy]
self_named_module_files = "deny"
